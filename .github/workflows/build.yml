name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y
          echo "=== build output ==="
          find build -type f 2>/dev/null | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilExpand-levipack
          path: |
            build/android/arm64-v8a/release/RecoilExpand.levipack
            build/android/arm64-v8a/release/libRecoilExpand.so
          if-no-files-found: error
